# 公网部署：Nginx（前端静态 + /api 反代）+ relay（发信中继）
# 用法: docker compose -f compose.public.yml up -d --build
# 前置: 域名解析到本机，HTTPS 用 certbot 配置（见 deploy/DEPLOY.md 5.3）

services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: relay
    container_name: cz-relay
    restart: always
    environment:
      RELAY_PORT: 3003
      RELAY_SMTP_HOST: ${RELAY_SMTP_HOST:?}
      RELAY_SMTP_PORT: ${RELAY_SMTP_PORT:-465}
      RELAY_SMTP_USER: ${RELAY_SMTP_USER:?}
      RELAY_SMTP_PASS: ${RELAY_SMTP_PASS:?}
      RELAY_TO: ${RELAY_TO:?}
      RELAY_SMTP_FROM: ${RELAY_SMTP_FROM:?}
      RELAY_ALLOWED_ORIGINS: ${RELAY_ALLOWED_ORIGINS:?}
      RELAY_MAX_PER_MIN: ${RELAY_MAX_PER_MIN:-20}
    ports:
      - "127.0.0.1:3003:3003"   # 仅本机回环，只经 Nginx 暴露

  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    container_name: cz-public-nginx
    restart: always
    depends_on:
      - relay
    ports:
      - "80:80"
      - "443:443"
